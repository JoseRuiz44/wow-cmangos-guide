<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CMaNGOS WoW Classic 1.12.1 - Guía Interactiva</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <h1>CMaNGOS WoW Classic 1.12.1</h1>
      <p>Comandos por secciones/subsecciones + catálogo de ítems (sets, legendarios, épicos, raros)</p>
    </div>
  </header>

  <main class="container">
    <section class="panel">
      <div class="panel-head">
        <h2>Comandos GM</h2>
        <span id="commandsCount" class="badge"></span>
      </div>
      <div class="toolbar">
        <input id="commandSearch" type="search" placeholder="Buscar comando, alias, descripción..." />
        <select id="sectionFilter"><option value="all">Todas las secciones</option></select>
        <select id="subsectionFilter"><option value="all">Todas las subsecciones</option></select>
      </div>
      <div id="commandsSections"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Ítems</h2>
        <span id="itemsCount" class="badge"></span>
      </div>
      <div class="toolbar">
        <input id="itemSearch" type="search" placeholder="Buscar item por nombre o ID..." />
        <select id="qualityFilter">
          <option value="all">Todas las calidades</option>
          <option value="legendary">Legendarios</option>
          <option value="epic">Épicos</option>
          <option value="rare">Raros</option>
        </select>
        <input id="itemQty" type="number" min="1" value="1" />
      </div>
      <div id="itemsSections"></div>
    </section>
  </main>

  <div id="tooltip" class="tooltip"></div>
  <div id="toast" class="toast"></div>

  <script src="script.js"></script>
</body>
</html>
